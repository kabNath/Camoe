[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camoe"
version = "0.1.0"
description = "Channel-Aware Mixture-of-Experts: a runnable proof-of-concept for wireless-aware expert routing."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Wendenda Nathanael Kaboré" }]
keywords = ["mixture-of-experts", "wireless", "edge-ai", "routing", "6g", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.2", "numpy>=1.24", "matplotlib>=3.7", "pillow>=9.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
notebook = ["jupyter>=1.0", "nbformat>=5.9"]

[project.urls]
Repository = "https://github.com/kabNath/camoe"

[tool.setuptools.packages.find]
include = ["camoe*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
